{
  "name": "Runtime Source Validation",
  "on": {
    "push": {
      "branches": ["main"]
    },
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "runtime-qa-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out repository",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Validate tracked runtime sources",
          "run": "bash qa-local.sh"
        },
        {
          "name": "Confirm validation leaves checkout clean",
          "run": "test -z \"$(git status --porcelain)\""
        }
      ]
    }
  }
}
