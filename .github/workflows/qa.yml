{
  "name": "Runtime Source Validation",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "runtime-qa-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out repository",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Validate runtime sources and emit verification evidence",
          "run": "python -B scripts/run_runtime_verification.py --output \"${RUNNER_TEMP}/aift-runtime-verification.json\""
        },
        {
          "name": "Upload runtime verification evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "aift-runtime-verification",
            "path": "${{ runner.temp }}/aift-runtime-verification.json",
            "if-no-files-found": "warn"
          }
        },
        {
          "name": "Confirm validation leaves checkout clean",
          "run": "test -z \"$(git status --porcelain)\""
        }
      ]
    }
  }
}
